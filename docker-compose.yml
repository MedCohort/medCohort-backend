version: '3.8'

services: 
    app:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
       - "3000:3000"
      environment:
        DATABASE_URL: ${DATABASE_URL}
      volumes:
        - .:/app
        - ./logs:/app/logs
      depends_on:
        - db
      restart: always

    db:
      image: postgres:14
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "5411:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: 
